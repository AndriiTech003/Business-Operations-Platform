name: business-operations-platform

x-backend-env: &backend-env
  DATABASE_URL: postgres://bop:bop@postgres:5432/bop
  REDIS_URL: redis://redis:6379/5
  REDIS_PREFIX: bop
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: Business Ops <no-reply@bop.local>
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: bop
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  PUBLIC_API_URL: http://localhost:4500
  PUBLIC_WEB_URL: http://localhost:4511
  REALTIME_URL: http://realtime:4520
  REALTIME_SERVER_KEY: ${REALTIME_SERVER_KEY:-compose-realtime-server-key}
  REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:-compose-realtime-jwt-secret}
  JWT_SECRET: ${JWT_SECRET:-compose-demo-jwt-secret}
  SECRETS_KEY: ${SECRETS_KEY:-compose-demo-secrets-key-32-bytes}
  AI_PROVIDER: fake

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bop
      POSTGRES_PASSWORD: bop
      POSTGRES_DB: bop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bop -d bop']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['sh', '-c', 'node packages/core/dist/cli/seed.js']
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *backend-env
      API_HOST: 0.0.0.0
      API_PORT: '4500'
      CORS_ORIGINS: http://localhost:4511
    ports:
      - '4500:4500'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4500/health']
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *backend-env
      WORKER_METRICS_PORT: '4540'
    deploy:
      replicas: 2
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    environment:
      <<: *backend-env
      SCHEDULER_METRICS_PORT: '4541'
    depends_on:
      api:
        condition: service_healthy

  realtime:
    build:
      context: ..
      dockerfile: 05-business-operations-platform/apps/realtime/Dockerfile
    environment:
      PORT: '4520'
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379/5
      REDIS_PREFIX: 'bop:rt:'
      JWT_SECRET: ${REALTIME_JWT_SECRET:-compose-realtime-jwt-secret}
      SERVER_API_KEY: ${REALTIME_SERVER_KEY:-compose-realtime-server-key}
      ALLOWED_ORIGINS: http://localhost:4511
    ports:
      - '4520:4520'
    depends_on:
      redis:
        condition: service_healthy

  ops-mcp:
    build:
      context: .
      dockerfile: apps/ops-mcp/Dockerfile
    environment:
      BOP_API_URL: http://api:4500
      MCP_HOST: 0.0.0.0
      MCP_PORT: '4530'
    ports:
      - '4530:4530'
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4500
    ports:
      - '4511:80'
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
